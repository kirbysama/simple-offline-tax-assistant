[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-tools"
version = "0.1.0"
description = "Deterministic 1099 Aggregator & NY Sales Tax Calculator"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=5.0.0",
    "pdfplumber>=0.11.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
# Real-browser tests that click the table and assert on actual clipboard contents.
# These need `playwright install chromium` after installation.
browser-tests = [
    "pytest>=8.0.0",
    "pytest-playwright>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
markers = [
    "browser: requires a real browser via Playwright; skipped when unavailable",
]
